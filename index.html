:root{

  --panel:#1d2027;

  --mute:#a7a79f;
  --clip:#f0b64a;     /* main clip amber */

  --sky:#6f9be0;

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.85;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

.nav{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.logo{font-family:var(--display);font-weight:700;letter-spacing:.04em;text-decoration:none;direction:ltr}
.logo b{color:var(--clip)}
.nav-r{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;color:var(--paper);font:inherit;font-size:.92rem;padding:8px 18px;border-radius:999px;cursor:pointer;text-decoration:none;transition:background .2s,border-color .2s,color .2s}
.btn:hover{border-color:var(--paper)}
.btn.solid{background:var(--clip);border-color:var(--clip);color:#1a1405;font-weight:600}
.btn.solid:hover{background:#f7c766}
.navlinks{display:none;gap:22px;font-size:.92rem;color:var(--mute)}
.navlinks a{text-decoration:none}.navlinks a:hover{color:var(--paper)}

/* hero */
.ruler{height:26px;border-bottom:1px solid var(--line);position:relative;overflow:hidden;direction:ltr;background:
  repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 12px) bottom/100% 8px no-repeat,
  repeating-linear-gradient(90deg,var(--mute) 0 1px,transparent 1px 96px) bottom/100% 16px no-repeat}
.playhead{position:absolute;top:0;bottom:0;left:0;width:2px;background:var(--rose);animation:scrub 2.6s cubic-bezier(.6,.05,.2,1) forwards}
.playhead::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top-color:var(--rose);border-bottom:0}
@keyframes scrub{from{left:0}to{left:calc(100% - 2px)}}
.hero{padding:clamp(36px,6vw,72px) 0 clamp(48px,8vw,90px);border-top:0}
.hero-grid{display:grid;gap:36px;align-items:center}
@media(min-width:960px){.hero-grid{grid-template-columns:1fr 1.15fr}}
.hero h1{font-size:clamp(2rem,6.2vw,3.6rem);margin-bottom:.45em}
.hero p{color:var(--mute);max-width:46ch;margin-bottom:1.6rem}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.role{display:inline-block;color:var(--clip);font-size:.95rem;margin-bottom:.9rem}

/* player */
.player{position:relative;aspect-ratio:16/9;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.player img,.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.player .ph{position:absolute;inset:0;background:linear-gradient(135deg,var(--panel2),var(--panel))}
.player button.play{position:absolute;inset:0;width:100%;height:100%;border:0;background:rgba(10,11,14,.28);cursor:pointer;display:grid;place-items:center;transition:background .2s}
.player button.play:hover{background:rgba(10,11,14,.1)}
.player .tri{width:68px;height:68px;border-radius:50%;background:var(--clip);display:grid;place-items:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.player .tri::after{content:"";border-style:solid;border-width:11px 0 11px 18px;border-color:transparent transparent transparent #1a1405;margin-left:4px}
.openlink{display:inline-block;margin-top:8px;font-size:.84rem;color:var(--mute)}
.openlink:hover{color:var(--paper)}

/* proof strip */
.proof{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

.proof span{color:var(--mute);font-size:.9rem;line-height:1.6;display:block}

.row{display:grid;gap:6px 28px;padding:26px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}

.row p{color:var(--mute)}

/* work */

.chip{border:1px solid var(--line);background:transparent;color:var(--mute);font:inherit;font-size:.92rem;padding:7px 18px;border-radius:999px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip i{width:9px;height:9px;border-radius:2px;background:var(--c,var(--clip))}
.chip[aria-pressed=true]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.grid{display:grid;gap:26px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.card h3{font-size:1.05rem;margin:14px 0 4px}
.card p{color:var(--mute);font-size:.93rem;line-height:1.7}
.tag{font-size:.8rem;color:var(--c,var(--clip))}
.more{margin-top:34px;padding:26px;border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}

.steps{list-style:none;counter-reset:s;display:grid;gap:14px;margin-top:1rem}
.steps li{counter-increment:s;display:flex;gap:14px;color:var(--mute)}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--clip);color:var(--clip);display:grid;place-items:center;font-size:.9rem;font-family:var(--display)}

.plugin li{display:flex;gap:10px}
.plugin li::before{content:"";flex:none;width:8px;height:8px;margin-top:11px;background:var(--teal);border-radius:2px}
.badge{display:inline-block;background:var(--teal);color:#06201c;font-weight:600;font-size:.82rem;padding:2px 12px;border-radius:999px;margin-bottom:12px}

/* toolbox */
.kit{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.playhead{display:none}}

var lang = "ar";
function $(s,r){return (r||document).querySelector(s)}

function makePlayer(w){
  var box=document.createElement("div");
  box.className="player";
  var ph=document.createElement("div");ph.className="ph";box.appendChild(ph);
  var img=document.createElement("img");
  img.alt="";img.loading="lazy";
  img.src="https://drive.google.com/thumbnail?id="+w.id+"&sz=w1000";
  img.onerror=function(){img.remove()};
  box.appendChild(img);
  var b=document.createElement("button");
  b.className="play";b.type="button";
  b.setAttribute("aria-label",lang==="ar"?"تشغيل الفيديو":"Play video");
  b.innerHTML='<span class="tri"></span>';
  b.onclick=function(){
    var f=document.createElement("iframe");
    f.src="https://drive.google.com/file/d/"+w.id+"/preview";
    f.allow="autoplay; fullscreen";
    f.allowFullscreen=true;
    f.title=w[lang][0];
    box.innerHTML="";box.appendChild(f);
  };
  box.appendChild(b);
  var wrap=document.createElement("div");
  wrap.appendChild(box);
  var a=document.createElement("a");
  a.className="openlink";a.target="_blank";a.rel="noopener";
  a.href="https://drive.google.com/file/d/"+w.id+"/view";
  a.textContent=lang==="ar"?"الفيديو مش بيشتغل؟ افتحه على Drive":"Video not playing? Open on Drive";
  wrap.appendChild(a);
  return wrap;
}

var filter="all";
function renderWork(){
  var chips=$("#chips"),grid=$("#grid");
  chips.innerHTML="";grid.innerHTML="";
  var present=[];
  WORKS.forEach(function(w){if(present.indexOf(w.cat)<0)present.push(w.cat)});
  var all=document.createElement("button");
  all.className="chip";all.type="button";
  all.setAttribute("aria-pressed",filter==="all");
  all.textContent=lang==="ar"?"الكل":"All";
  all.onclick=function(){filter="all";renderWork()};
  chips.appendChild(all);
  present.forEach(function(k){
    var c=document.createElement("button");
    c.className="chip";c.type="button";
    c.style.setProperty("--c",CATS[k].c);
    c.setAttribute("aria-pressed",filter===k);
    c.innerHTML="<i></i>"+CATS[k][lang];
    c.onclick=function(){filter=k;renderWork()};
    chips.appendChild(c);
  });
  WORKS.filter(function(w){return filter==="all"||w.cat===filter}).forEach(function(w){
    var card=document.createElement("article");
    card.className="card";
    card.style.setProperty("--c",CATS[w.cat].c);
    card.appendChild(makePlayer(w));
    var t=document.createElement("div");
    t.innerHTML='<h3></h3><span class="tag"></span><p></p>';
    $("h3",t).textContent=w[lang][0];
    $(".tag",t).textContent=CATS[w.cat][lang];
    $("p",t).textContent=w[lang][1];
    card.appendChild(t);
    grid.appendChild(card);
  });
}

function renderHero(){
  var h=$("#heroPlayer");h.innerHTML="";
  h.appendChild(makePlayer(WORKS[0]));
}

function apply(){
  var d=T[lang];
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(function(el){
    var k=el.getAttribute("data-i");
    if(d[k]!==undefined)el.textContent=d[k];
  });
  $("#lang").textContent=lang==="ar"?"English":"عربي";
  renderHero();renderWork();
  try{localStorage.setItem("lang",lang)}catch(e){}
}

$("#lang").onclick=function(){lang=lang==="ar"?"en":"ar";apply()};
try{var s=localStorage.getItem("lang");if(s==="en"||s==="ar")lang=s}catch(e){}
apply();
</script>
