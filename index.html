<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amar ENP — مونتير وصانع محتوى</title>
<meta name="description" content="Amar ENP: مونتير فيديو محترف وصانع محتوى. مونتاج، تلوين، صوت، تصوير وفيديوهات بالذكاء الاصطناعي، ومؤسس بلاجين ENP لبريمير.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== ألوان الموقع (مستوحاة من موقع بلاجين ENP): غيّرها من هنا بس ===== */
:root{
  --ink:#0c0910;      /* الخلفية */
  --panel:#171019;
  --panel2:#221625;
  --line:#35242f;
  --paper:#f6eef2;    /* لون الكلام */
  --mute:#a8929f;
  --clip:#d4467a;     /* اللون الأساسي (قرمزي) */
  --clip2:#8e1f45;    /* تدرج الزراير */
  --teal:#e9b061;     /* ذهبي */
  --rose:#ff5c86;     /* البلاي هيد */
  --sky:#7f9fd6;      /* أزرق */
  --mauve:#b58aa8;
  --r:14px;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --tlh:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto;scroll-padding-top:70px}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.85;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top);overflow-x:hidden}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:6px}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto}
h1,h2,h3{font-family:var(--display);line-height:1.35;font-weight:700}
h2{font-size:clamp(1.6rem,4.4vw,2.4rem);margin-bottom:.4em;max-width:24ch}
p.lead{color:var(--mute);max-width:62ch;margin-bottom:2rem}
section{padding:clamp(56px,9vw,104px) 0;border-top:1px solid var(--line);position:relative}
.grad{background:linear-gradient(90deg,#f4a063,#e8cf8d);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

/* background */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 520px at 50% -8%,rgba(140,24,70,.2),transparent 65%),radial-gradient(700px 500px at 100% 100%,rgba(60,30,110,.08),transparent 70%)}
header,main,footer{position:relative;z-index:1}

/* nav */
header{position:sticky;top:0;z-index:20;background:rgba(12,9,16,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.logo{font-family:var(--display);font-weight:700;letter-spacing:.04em;text-decoration:none;direction:ltr}
.logo b{color:var(--teal)}
.nav-r{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--paper);font:inherit;font-size:.92rem;padding:8px 18px;border-radius:999px;cursor:pointer;text-decoration:none;transition:border-color .2s,transform .2s}
.btn:hover{border-color:var(--mauve)}
.btn.solid{background:linear-gradient(180deg,#c93d70,var(--clip2));border-color:#b0305e;color:#fff;font-weight:600;box-shadow:0 6px 24px rgba(200,50,100,.28)}
.btn.solid:hover{transform:translateY(-1px)}
.navlinks{display:none;gap:22px;font-size:.92rem;color:var(--mute)}
.navlinks a{text-decoration:none}.navlinks a:hover{color:var(--paper)}
@media(min-width:900px){.navlinks{display:flex}}

/* hero */
.ruler{height:26px;border-bottom:1px solid var(--line);position:relative;overflow:hidden;direction:ltr;background:
  repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 12px) bottom/100% 8px no-repeat,
  repeating-linear-gradient(90deg,var(--mute) 0 1px,transparent 1px 96px) bottom/100% 16px no-repeat}
.playhead{position:absolute;top:0;bottom:0;left:0;width:2px;background:var(--rose);animation:scrub 2.6s cubic-bezier(.6,.05,.2,1) forwards}
.playhead::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top-color:var(--rose);border-bottom:0}
@keyframes scrub{from{left:0}to{left:calc(100% - 2px)}}
.hero{padding:clamp(36px,6vw,72px) 0 clamp(48px,8vw,90px);border-top:0}
.hero-grid{display:grid;gap:36px;align-items:center}
@media(min-width:960px){.hero-grid{grid-template-columns:1fr 1.15fr}}
.hero h1{font-size:clamp(2.1rem,6.4vw,3.7rem);margin-bottom:.45em}
.hero h1 span{display:block}
.hero p{color:var(--mute);max-width:46ch;margin-bottom:1.6rem}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.role{display:inline-block;color:var(--teal);font-size:.95rem;margin-bottom:.9rem}

/* player */
.player{position:relative;aspect-ratio:16/9;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.player img,.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.player .ph{position:absolute;inset:0;background:linear-gradient(135deg,var(--panel2),var(--panel))}
.player button.play{position:absolute;inset:0;width:100%;height:100%;border:0;background:rgba(10,6,12,.3);cursor:pointer;display:grid;place-items:center;transition:background .2s}
.player button.play:hover{background:rgba(10,6,12,.1)}
@media(hover:hover){
  .player button.play{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30' viewBox='0 0 24 24' fill='none' stroke-linecap='round'><g stroke='black' stroke-width='4.4'><path d='M4 4l8 8M4 20l8-8M11 12l10-5M11 12l10 5'/></g><g stroke='white' stroke-width='2'><path d='M4 4l8 8M4 20l8-8M11 12l10-5M11 12l10 5'/></g></svg>") 5 5,pointer}
}
.player .tri{width:68px;height:68px;border-radius:50%;background:linear-gradient(180deg,#c93d70,var(--clip2));display:grid;place-items:center;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.player .tri::after{content:"";border-style:solid;border-width:11px 0 11px 18px;border-color:transparent transparent transparent #fff;margin-left:4px}
.openlink{display:inline-block;margin-top:8px;font-size:.84rem;color:var(--mute)}
.openlink:hover{color:var(--paper)}
.fc{position:absolute;z-index:3;width:28px;left:78%;top:92%;opacity:0;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));animation:fcmove 3.6s 1.4s cubic-bezier(.5,0,.2,1) forwards}
.fc svg{display:block}
.rip{position:absolute;z-index:3;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:2px solid var(--paper);opacity:0;pointer-events:none;animation:rip .8s 4.4s ease-out forwards}
@keyframes fcmove{0%{opacity:0;left:78%;top:92%}15%{opacity:1}62%{left:50%;top:50%;transform:scale(1)}70%{transform:scale(.8)}78%{left:50%;top:50%;transform:scale(1)}100%{opacity:1;left:58%;top:60%}}
@keyframes rip{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(1.7)}}

/* proof strip */
.proof{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:rgba(23,16,25,.72);backdrop-filter:blur(4px)}
@media(min-width:800px){.proof{grid-template-columns:repeat(4,1fr)}}
.proof div{padding:20px 22px;border-inline-start:1px solid var(--line);border-top:1px solid var(--line);margin:-1px 0 0 -1px}
.proof strong{display:block;font-family:var(--display);font-size:1.12rem;margin-bottom:2px}
.proof span{color:var(--mute);font-size:.9rem;line-height:1.6;display:block}

/* rows */
.rows{display:grid}
.row{display:grid;gap:6px 28px;padding:26px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
@media(min-width:800px){.row{grid-template-columns:280px 1fr}}
.row h3{font-size:1.12rem;display:flex;gap:12px;align-items:flex-start}
.row h3::before{content:"";flex:none;width:10px;height:22px;border-radius:3px;margin-top:6px;background:var(--c,var(--clip))}
.row p{color:var(--mute)}

/* work */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.chip{border:1px solid var(--line);background:transparent;color:var(--mute);font:inherit;font-size:.92rem;padding:7px 18px;border-radius:999px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip i{width:9px;height:9px;border-radius:2px;background:var(--c,var(--clip))}
.chip[aria-pressed=true]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.grid{display:grid;gap:26px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.card h3{font-size:1.05rem;margin:14px 0 4px}
.card p{color:var(--mute);font-size:.93rem;line-height:1.7}
.tag{font-size:.8rem;color:var(--c,var(--clip))}
.more{margin-top:34px;padding:26px;border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;background:rgba(23,16,25,.6)}
.more p{color:var(--mute);max-width:56ch}

/* ai + plugin */
.split{display:grid;gap:36px}
@media(min-width:900px){.split{grid-template-columns:1fr 1fr}}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:1.2rem 0}
.tools span{border:1px solid var(--line);border-radius:8px;padding:3px 12px;font-size:.88rem;direction:ltr;background:rgba(23,16,25,.6)}
.steps{list-style:none;counter-reset:s;display:grid;gap:14px;margin-top:1rem}
.steps li{counter-increment:s;display:flex;gap:14px;color:var(--mute)}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--clip);color:var(--clip);display:grid;place-items:center;font-size:.9rem;font-family:var(--display)}
.steps b{color:var(--paper);font-weight:600}
.plugin{background:rgba(23,16,25,.82);border:1px solid var(--line);border-radius:var(--r);padding:clamp(24px,4vw,40px)}
.plugin ul{list-style:none;display:grid;gap:8px;margin:1.2rem 0 1.6rem;color:var(--mute)}
.plugin li{display:flex;gap:10px}
.plugin li::before{content:"";flex:none;width:8px;height:8px;margin-top:11px;background:var(--clip);border-radius:2px}
.badge{display:inline-block;background:linear-gradient(90deg,#f4a063,#e8cf8d);color:#1a1405;font-weight:600;font-size:.82rem;padding:2px 12px;border-radius:999px;margin-bottom:12px}

/* ===== scroll stories ===== */
section.story{padding:0;height:260vh}
.pin{position:sticky;top:60px;height:calc(100vh - 60px - var(--tlh) - env(safe-area-inset-bottom));height:calc(100svh - 60px - var(--tlh) - env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;overflow:hidden;padding:0 20px}
.swap{display:grid;max-width:min(760px,100%)}
.swap>div{grid-area:1/1;transition:opacity .5s,transform .5s}
.swap .b{opacity:0;transform:translateY(18px)}
.swap.on .a{opacity:0;transform:translateY(-18px)}
.swap.on .b{opacity:1;transform:none}
.big{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,6.4vw,3.3rem);line-height:1.3}
.sub{color:var(--mute);margin-top:.6rem;font-size:clamp(.95rem,2.6vw,1.1rem)}
.cue{font:.72rem var(--mono);color:var(--mute);direction:ltr;opacity:.9;transition:opacity .4s}
/* cut */
.cut{position:relative;width:min(760px,100%);height:84px;direction:ltr;margin-top:40px}
.piece{position:absolute;top:0;bottom:0;border-radius:8px;background:linear-gradient(180deg,#d4467a,#8e1f45);overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.piece::after{content:"";position:absolute;inset:auto 0 0 0;height:36%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 2px,transparent 2px 5px);opacity:.28;-webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
.piece em{position:absolute;top:8px;left:10px;font:600 .66rem var(--mono);color:rgba(255,255,255,.9);font-style:normal;white-space:nowrap}
#cutLine{position:absolute;top:-12px;bottom:-12px;width:0;border-left:2px dashed var(--rose);pointer-events:none;opacity:0}
#scis{position:absolute;top:-52px;left:0;width:54px;height:54px;pointer-events:none;opacity:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
#scis svg{width:100%;height:100%;transform:rotate(90deg)}
#scis g{transform-origin:22px 24px}
/* grade */
.gstage{position:relative;width:min(100%,calc(44vh*1.7778));width:min(100%,calc(44svh*1.7778));aspect-ratio:16/9;margin-top:86px;border-radius:12px;box-shadow:0 14px 50px rgba(0,0,0,.5)}
.gstage canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:12px;background:#000}
#gGrad{--r:0px;-webkit-mask-image:radial-gradient(circle at 50% 0,#000 var(--r),transparent calc(var(--r) + 26px));mask-image:radial-gradient(circle at 50% 0,#000 var(--r),transparent calc(var(--r) + 26px))}
#bucket{position:absolute;top:-82px;left:calc(50% - 93px);width:120px;height:110px;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));z-index:3}
#bucket svg{width:100%;height:100%;overflow:visible}
#bucketG{transform-origin:60px 55px}
#pour{position:absolute;z-index:2;top:-8px;left:calc(50% - 5px);width:10px;height:0;border-radius:6px;background:linear-gradient(180deg,#f4a063,#d4467a,#7f9fd6,#f4a063);background-size:100% 200%;opacity:0;animation:flow .6s linear infinite}
@keyframes flow{to{background-position:0 -200%}}
/* save */
.roles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:720px}
.role-pill{padding:8px 22px;border:1px solid var(--line);border-radius:999px;font-family:var(--display);font-size:clamp(1rem,3.4vw,1.3rem);background:rgba(23,16,25,.8);position:relative;transition:opacity .4s,color .4s,border-color .4s}
.role-pill.done{opacity:.4;color:var(--mute);border-color:transparent;text-decoration:line-through;text-decoration-color:var(--rose);text-decoration-thickness:2px}
.final{opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}
.final.on{opacity:1;transform:none}

/* color scopes */
.scopes{display:grid;gap:18px}
@media(min-width:900px){.scopes{grid-template-columns:1.35fr 1fr;align-items:start}}
.monitor{background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.monitor canvas{display:block;width:100%;height:auto}
.mlabel{font-family:var(--mono);font-size:.72rem;color:var(--mute);padding:6px 10px;direction:ltr;background:var(--panel)}
.scopecol{display:grid;gap:18px}
.grader{margin-top:22px;display:flex;align-items:center;gap:16px;direction:ltr;font-family:var(--mono);font-size:.82rem;color:var(--mute)}
.grader input{flex:1;accent-color:var(--clip);height:28px}
.note{font-size:.84rem;color:var(--mute);margin-top:12px}

/* toolbox */
.kit{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kit div{padding:20px 22px;background:rgba(23,16,25,.82);border-radius:var(--r);border-top:3px solid var(--c)}
.kit h3{font-size:1.02rem;margin-bottom:4px}
.kit p{color:var(--mute);font-size:.92rem;line-height:1.7}

/* contact */
.contact{text-align:center}
.contact h2{font-size:clamp(1.9rem,6vw,3.2rem);margin-inline:auto}
.contact p.lead{margin-inline:auto}
.contact .cta{justify-content:center}
.meta{margin-top:28px;color:var(--mute);font-size:.92rem;direction:ltr}
footer{padding:26px 0 calc(var(--tlh) + 34px + env(safe-area-inset-bottom));border-top:1px solid var(--line);color:var(--mute);font-size:.85rem;text-align:center}

/* timeline bar */
#tl{position:fixed;left:0;right:0;bottom:0;z-index:30;direction:ltr;display:flex;height:calc(var(--tlh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(12,9,16,.97);border-top:1px solid var(--line)}
.tl-info{flex:none;width:112px;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
.tl-info b{font:600 .9rem var(--mono);color:var(--rose);letter-spacing:.02em}
.tl-info span{font:.62rem var(--mono);color:var(--mute)}
.tl-tracks{position:relative;flex:1;height:var(--tlh);cursor:ew-resize;touch-action:none;overflow:hidden}
.tl-lab{position:absolute;left:4px;font:600 .6rem var(--mono);color:var(--mute);z-index:2;pointer-events:none;background:rgba(12,9,16,.7);padding:0 3px;border-radius:2px}
.tl-v{position:absolute;left:0;right:0;top:7px;height:21px}
.tl-a{position:absolute;left:0;right:0;top:31px;height:18px}
.clip{position:absolute;top:0;bottom:0;border-radius:3px;color:#14080f;font:600 .62rem/21px var(--mono);padding:0 6px 0 22px;overflow:hidden;white-space:nowrap;opacity:.88}
.clip.on{opacity:1;box-shadow:inset 0 0 0 1.5px #fff}
#wave{position:absolute;inset:0;width:100%;height:100%}
#ph{position:absolute;top:0;bottom:0;left:0;width:2px;background:var(--rose);z-index:5;pointer-events:none;will-change:transform}
#ph::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top-color:var(--rose);border-bottom:0}
@media(max-width:520px){.tl-info{width:92px}.tl-info b{font-size:.78rem}}

@media(prefers-reduced-motion:reduce){.playhead,.fc,.rip,#pour{animation:none!important}.fc,.rip{display:none}.swap>div,.final,.role-pill{transition:none}}
</style>
</head>
<body>
<div class="glow"></div>
<canvas id="bg" aria-hidden="true"></canvas>

<header>
  <div class="wrap nav">
    <a class="logo" href="#top">AMAR<b>.</b>ENP</a>
    <nav class="navlinks">
      <a href="#work" data-i="nav_work"></a>
      <a href="#ai" data-i="nav_ai"></a>
      <a href="#plugin" data-i="nav_plugin"></a>
      <a href="#contact" data-i="nav_contact"></a>
    </nav>
    <div class="nav-r">
      <button class="btn" id="lang" type="button" aria-label="Switch language">English</button>
    </div>
  </div>
</header>

<main id="top">
<div class="ruler" aria-hidden="true"><div class="playhead"></div></div>

<section class="hero" data-clip="INTRO" data-c="#7f9fd6">
  <div class="wrap hero-grid">
    <div>
      <span class="role" data-i="role"></span>
      <h1><span data-i="h1a"></span><span class="grad" data-i="h1b"></span></h1>
      <p data-i="hero_p"></p>
      <div class="cta">
        <a class="btn solid" href="https://wa.me/201289191494" target="_blank" rel="noopener" data-i="cta_wa"></a>
        <a class="btn" href="#work" data-i="cta_work"></a>
      </div>
    </div>
    <div id="heroPlayer"></div>
  </div>
</section>

<section style="padding-top:0;border-top:0">
  <div class="wrap">
    <div class="proof">
      <div><strong data-i="p1t"></strong><span data-i="p1d"></span></div>
      <div><strong data-i="p2t"></strong><span data-i="p2d"></span></div>
      <div><strong data-i="p3t"></strong><span data-i="p3d"></span></div>
      <div><strong data-i="p4t"></strong><span data-i="p4d"></span></div>
    </div>
  </div>
</section>

<section id="why" data-clip="WHY ME" data-c="#e9b061">
  <div class="wrap">
    <h2 data-i="why_h"></h2>
    <p class="lead" data-i="why_lead"></p>
    <div class="rows">
      <div class="row" style="--c:var(--clip)"><h3 data-i="w1t"></h3><p data-i="w1d"></p></div>
      <div class="row" style="--c:var(--teal)"><h3 data-i="w2t"></h3><p data-i="w2d"></p></div>
      <div class="row" style="--c:var(--sky)"><h3 data-i="w3t"></h3><p data-i="w3d"></p></div>
      <div class="row" style="--c:var(--mauve)"><h3 data-i="w4t"></h3><p data-i="w4d"></p></div>
    </div>
  </div>
</section>

<!-- STORY 1: scissors cut the timeline -->
<section class="story" id="cutStory" data-clip="CUT" data-c="#d4467a">
  <div class="pin">
    <div class="swap" id="cutSwap">
      <div class="a"><div class="big" data-i="cut1"></div></div>
      <div class="b"><div class="big grad" data-i="cut2"></div><p class="sub" data-i="cut_sub"></p></div>
    </div>

  x.fillStyle="#12151d";x.beginPath();x.arc(46,86,9,0,6.3);x.fill();x.fillRect(37,86,18,22);

function sc(x){return x*x*(3-2*x)}
function gradeImage(t){
  var out=new ImageData(SW,SH),s=srcData.data,o=out.data,i,r,g,b,Y,lr,lg,lb,gr,gg,gb;
  for(i=0;i<s.length;i+=4){
    r=s[i]/255;g=s[i+1]/255;b=s[i+2]/255;
    lr=.17+.6*r;lg=.17+.6*g;lb=.17+.6*b;
    Y=.2126*lr+.7152*lg+.0722*lb;
    lr=Y+(lr-Y)*.4;lg=Y+(lg-Y)*.4;lb=Y+(lb-Y)*.4;
    Y=.2126*r+.7152*g+.0722*b;
    gr=r+.85*(sc(r)-r);gg=g+.85*(sc(g)-g);gb=b+.85*(sc(b)-b);
    gr+=(.05*Y)-.03*(1-Y);gg+=.015*Y+.01*(1-Y);gb+=-.04*Y+.04*(1-Y);
    Y=.2126*gr+.7152*gg+.0722*gb;
    gr=Y+(gr-Y)*1.12;gg=Y+(gg-Y)*1.12;gb=Y+(gb-Y)*1.12;
    o[i]=clamp(lr+(gr-lr)*t)*255;o[i+1]=clamp(lg+(gg-lg)*t)*255;o[i+2]=clamp(lb+(gb-lb)*t)*255;o[i+3]=255;

}
var pic=$("#pic"),pctx=pic.getContext("2d"),par=$("#parade"),pxc=par.getContext("2d"),vec=$("#vec"),vxc=vec.getContext("2d");
function renderScopes(t){
  var out=gradeImage(t),o=out.data,i,r,g,b,k,py,px,ch;
  pctx.putImageData(out,0,0);
  var W=par.width,H=par.height,pw=W/3;

  pxc.strokeStyle="rgba(255,255,255,.14)";pxc.lineWidth=1;
  for(k=0;k<=4;k++){py=Math.round(H*k/4)+.5;pxc.beginPath();pxc.moveTo(0,py);pxc.lineTo(W,py);pxc.stroke()}
  pxc.globalCompositeOperation="lighter";
  var cols=["rgba(255,70,70,.2)","rgba(70,255,100,.2)","rgba(80,140,255,.22)"];
  for(ch=0;ch<3;ch++){
    pxc.fillStyle=cols[ch];
    for(i=0;i<o.length;i+=4){
      var n=i/4;
      px=ch*pw+(n%SW)/SW*pw;py=(1-o[i+ch]/255)*(H-2);
      pxc.fillRect(px,py,1.6,1.6);
    }
  }
  var VW=vec.width,VH=vec.height,cx=VW/2,cy=VH/2,R=Math.min(VW,VH)/2-8,ang;
  vxc.globalCompositeOperation="source-over";vxc.fillStyle="#050607";vxc.fillRect(0,0,VW,VH);
  vxc.strokeStyle="rgba(255,255,255,.16)";vxc.lineWidth=1;
  vxc.beginPath();vxc.arc(cx,cy,R,0,6.3);vxc.stroke();
  vxc.beginPath();vxc.arc(cx,cy,R*.5,0,6.3);vxc.stroke();
  vxc.beginPath();vxc.moveTo(cx-R,cy);vxc.lineTo(cx+R,cy);vxc.moveTo(cx,cy-R);vxc.lineTo(cx,cy+R);vxc.stroke();
  ang=123*Math.PI/180;
  vxc.strokeStyle="rgba(233,176,97,.65)";vxc.beginPath();vxc.moveTo(cx,cy);vxc.lineTo(cx+Math.cos(ang)*R,cy-Math.sin(ang)*R);vxc.stroke();
  vxc.globalCompositeOperation="lighter";vxc.fillStyle="rgba(120,255,170,.2)";
  for(i=0;i<o.length;i+=4){
    r=o[i]/255;g=o[i+1]/255;b=o[i+2]/255;
    var cb=-.1687*r-.3313*g+.5*b,cr=.5*r-.4187*g-.0813*b;
    vxc.fillRect(cx+cb*2*R*.95,cy-cr*2*R*.95,1.6,1.6);
  }
}

function updateCut(p){
  var W=track.clientWidth,pp=clamp(p/.66),px=pp*W,G=22,i,s=[0,0,0,0,0];
  for(i=1;i<=3;i++)s[i]=clamp((px-i*W/4)/(W*.05));
  for(i=0;i<4;i++){
    var inL=i>0?s[i]*G/2:0,inR=i<3?s[i+1]*G/2:0,sep=(s[i]+(i<3?s[i+1]:0))/2;

  }
  var on=p>0.01&&p<.7;

  scis.style.transform="translateX("+(px-27)+"px)";cline.style.left=px+"px";
  var th=6+16*(.5+.5*Math.sin(p*90));

/* ============ interactive background ============ */
var bg=$("#bg"),bx=bg.getContext("2d"),parts=[],mouse={x:-999,y:-999,on:false},BW=0,BH=0,lastY=window.scrollY,impulse=0;
var PC=["#e0478a","#7f9fd6","#e9b061","#b58aa8"];

  var dpr=Math.min(2,window.devicePixelRatio||1);
  BW=window.innerWidth;BH=window.innerHeight;
  bg.width=BW*dpr;bg.height=BH*dpr;bx.setTransform(dpr,0,0,dpr,0,0);
  var n=BW<600?14:26;
  parts=[];
  for(var i=0;i<n;i++)parts.push({x:Math.random()*BW,y:Math.random()*BH,vx:(Math.random()-.5)*.1,vy:(Math.random()-.5)*.1,r:.8+Math.random()*1.1,c:PC[i%4],z:.4+Math.random()*.9});
}
function stepBG(){
  bx.clearRect(0,0,BW,BH);
  var i,j,p,q,dx,dy,d,f;
  if(mouse.on){
    var g=bx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,170);
    g.addColorStop(0,"rgba(212,70,122,.05)");g.addColorStop(1,"rgba(212,70,122,0)");
    bx.fillStyle=g;bx.fillRect(mouse.x-170,mouse.y-170,340,340);
  }

  for(i=0;i<parts.length;i++){
    p=parts[i];
    if(!reduce){
      dx=p.x-mouse.x;dy=p.y-mouse.y;d=Math.sqrt(dx*dx+dy*dy);
      if(mouse.on&&d<90&&d>0){f=(90-d)/90*.3;p.vx+=dx/d*f;p.vy+=dy/d*f}
      p.vy+=impulse*p.z*.015;
      p.vx*=.96;p.vy*=.96;
      p.vx+=(Math.random()-.5)*.004;p.vy+=(Math.random()-.5)*.004;
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<-10)p.x=BW+10;if(p.x>BW+10)p.x=-10;if(p.y<-10)p.y=BH+10;if(p.y>BH+10)p.y=-10;

var tracks=$("#tracks"),tv=$("#tv"),ph=$("#ph"),tcEl=$("#tc"),clips=[],DUR=60,FPS=25;

  tv.innerHTML="";clips=[];
  for(i=0;i<secs.length;i++){tops.push(Math.max(0,secs[i].getBoundingClientRect().top+window.scrollY))}
  tops[0]=0;

    var a=Math.min(1,tops[i]/maxScroll()),b=Math.min(1,(i<secs.length-1?tops[i+1]:maxScroll())/maxScroll());

  var c=$("#wave"),w=tracks.clientWidth,h=18,x,dpr=window.devicePixelRatio||1;
  c.width=w*dpr;c.height=h*dpr;
  var g=c.getContext("2d");g.scale(dpr,dpr);

  g.fillStyle="#b58aa8";

  for(x=0;x<w;x+=2){
    seed=(seed*9301+49297)%233280;
    var env=.35+.65*Math.abs(Math.sin(x/37)*Math.cos(x/91));

  }
}

}
